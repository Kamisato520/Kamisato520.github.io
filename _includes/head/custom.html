{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" href="{{ base_path }}/images/favicon.ico">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">

<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Pre-paint language class: avoids flash of wrong language (i18n).
     NOTE: the html state class must be lang-zh-active, NOT lang-zh —
     the content-block class .lang-zh carries `display: none` in home.css,
     so naming the html state class identically would hide the whole page. -->
<script>
try {
  var l = localStorage.getItem('wowpage_lang');
  if (l !== 'zh' && l !== 'en') {
    l = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
  }
  document.documentElement.classList.toggle('lang-zh-active', l === 'zh');
} catch (e) {}
</script>
<script defer src="{{ base_path }}/assets/js/lang-switch.js"></script>


<!-- MathJax removed: the homepage contains no math, and the CDN adds a
     render-blocking script from a domain that is slow in mainland China.
     Re-add the async MathJax script here if math content is ever needed. -->

<!-- end custom head snippets -->
